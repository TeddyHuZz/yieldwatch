name: Keep Supabase Active

on:
  schedule:
    # Runs at 00:00 UTC every Monday and Thursday (every 3-4 days)
    - cron: "0 0 * * 1,4"
  workflow_dispatch: # Allows manual trigger in the GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping YieldWatch API
        run: |
          # Pings your database keepalive endpoint to keep Supabase active
          curl -s -f "https://shares-yieldwatch.vercel.app/api/keepalive" > /dev/null
          echo "YieldWatch database keepalive endpoint pinged successfully."

